<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>mashang-miit</title><link rel="icon" type="image/gif" sizes="512x512" href="/favicon.gif"><link rel="stylesheet" href="/styles.css"></head>
<body><div class="app-shell">
<header class="app-header"><picture class="brand-icon"><source media="(prefers-reduced-motion: reduce)" srcset="/brand.png"><img src="/favicon.gif" width="48" height="48" alt="浣熊伙伴"></picture><div class="brand-copy"><h1>mashang-miit</h1><p>工信部公告 · 采集与报告</p></div></header>
<section class="capture"><form id="capture"><label class="sr-only" for="url">公告来源</label><div class="capture-row"><input id="url" type="url" required placeholder="粘贴工信部公告链接…"><button id="submit">开始采集</button></div><p id="notice" role="status"></p></form></section>

</div><script src="/vendor/markdown.js"></script><script src="/app.js"></script><script src="/library.js"></script></body></html>
